<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DomTack history</title>
<link rel="icon" href="icons/icon.svg">
<style>
  :root {
    --bg: #f8f7f5; --surface: #fff; --sunken: #f1efec; --line: #e4e1dc;
    --text: #1f1d1a; --muted: #6f6a63; --faint: #9a948b;
    --accent: #e8590c; --accent-soft: #fff1e6; --accent-text: #b8470a;
    --warn: #b35c00; --warn-soft: #fff4e0; --danger: #c92a2a;
    --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --surface: #211f1c; --sunken: #2a2824; --line: #35322d;
      --text: #ece9e4; --muted: #a39d94; --faint: #7a746b;
      --accent: #ff7a2e; --accent-soft: #3a2416; --accent-text: #ffa36b;
      --warn: #ffb347; --warn-soft: #3a2c14; --danger: #ff6b6b;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .3);
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  [hidden] { display: none !important; }

  header { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; }
  .brand svg { color: var(--accent); }
  .count { color: var(--muted); font-weight: 400; font-size: 13px; }
  .search { flex: 1 1 260px; max-width: 420px; margin-left: auto; position: relative; }
  .search input { width: 100%; padding: 8px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface); }
  .search input:focus + kbd { display: none; }

  main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 64px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 28px 0 12px; display: flex; gap: 8px; align-items: baseline; }
  h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .12s, box-shadow .12s; }
  .card:hover, .card:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); }
  .card.copied { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .thumb { all: unset; cursor: pointer; display: grid; place-items: center; height: 150px; padding: 14px; position: relative;
    background: repeating-conic-gradient(var(--sunken) 0 25%, transparent 0 50%) 0 0 / 14px 14px, var(--surface); border-bottom: 1px solid var(--line); }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 3px; box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgb(0 0 0 / .08); background: #fff; }
  .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hint { position: absolute; inset: auto 8px 8px auto; padding: 3px 8px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 12px; opacity: 0; transform: translateY(4px); transition: .12s; }
  .card:hover .hint, .thumb:focus-visible .hint { opacity: .92; transform: none; }
  .card.copied .hint { opacity: 1; transform: none; background: var(--accent); color: #fff; }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }

  .body { padding: 10px 12px 12px; display: grid; gap: 4px; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .id { font-size: 13px; font-weight: 600; color: var(--accent-text); }
  .title, .meta, .selector { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-weight: 550; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta img { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; border-radius: 3px; }
  .selector { font-size: 11.5px; color: var(--faint); direction: rtl; text-align: left; }

  .actions { display: flex; gap: 2px; margin-left: auto; opacity: 0; transition: opacity .12s; }
  .card:hover .actions, .card:focus-within .actions { opacity: 1; }
  .icon { all: unset; cursor: pointer; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); }
  .icon:hover { background: var(--sunken); color: var(--text); }
  .icon:focus-visible { outline: 2px solid var(--accent); }
  .icon.danger:hover { color: var(--danger); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 14px; border-radius: 10px; background: var(--text); color: var(--bg); box-shadow: var(--shadow); font-size: 13.5px; }
  .toast b { font-family: ui-monospace, monospace; }

  .empty { margin: 80px auto; max-width: 360px; text-align: center; color: var(--muted); }
  .empty .pin { width: 56px; height: 56px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 16px; background: var(--accent-soft); color: var(--accent); }
  .empty h3 { color: var(--text); margin: 0 0 6px; font-size: 16px; }
  @media (max-width: 520px) { .search { margin-left: 0; max-width: none; } }
</style>

<svg hidden><symbol id="pin" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 2.5a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4l-1.2 1.2a1 1 0 0 1-1.1.2l-3.3 3.3.3 3.6a1 1 0 0 1-.3.8l-1.3 1.3a1 1 0 0 1-1.4 0L9.6 15.3l-5.4 5.4a.9.9 0 0 1-1.3-1.3l5.4-5.4-3.6-3.6a1 1 0 0 1 0-1.4L6 7.7a1 1 0 0 1 .8-.3l3.6.3 3.3-3.3a1 1 0 0 1 .2-1.1z"/></symbol></svg>

<header>
  <div class="bar">
    <div class="brand"><svg width="20" height="20" aria-hidden="true"><use href="#pin"/></svg>DomTack <span class="count"></span></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search id, page, text, selector…" aria-label="Search tacks">
      <kbd>/</kbd>
    </label>
  </div>
</header>

<main></main>

<div class="empty" hidden>
  <div class="pin"><svg width="26" height="26" aria-hidden="true"><use href="#pin"/></svg></div>
  <h3></h3><p></p>
</div>

<div class="toast" role="status" hidden></div>

<template id="card">
  <article class="card">
    <button class="thumb" title="Copy image + id"><img alt=""><span class="hint">Copy</span></button>
    <div class="body">
      <div class="row">
        <span class="id mono"></span>
        <div class="actions">
          <button class="icon" data-action="id" title="Copy text only (id, or context in standalone mode)" aria-label="Copy text only"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></button>
          <button class="icon" data-action="image" title="Copy image only" aria-label="Copy image only"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
          <button class="icon" data-action="open" title="Open page" aria-label="Open page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
          <button class="icon danger" data-action="delete" title="Delete" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        </div>
      </div>
      <div class="title"></div>
      <div class="meta"><img alt="" hidden><span></span></div>
      <div class="selector mono"></div>
    </div>
  </article>
</template>

<script src="history.js"></script>
</html>
